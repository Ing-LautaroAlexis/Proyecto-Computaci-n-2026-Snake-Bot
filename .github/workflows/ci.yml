name: Tests, coverage and complexity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check syntax
        run: python -m compileall -q src tests simulador versions arena.py
      - name: Complexity (xenon, grade A everywhere)
        # Incremento 3: cada función, cada módulo y el promedio tienen que dar A.
        # versions/ es historial y arena.py es una herramienta personal: no se miden.
        run: xenon --max-absolute A --max-modules A --max-average A --exclude "arena.py" --ignore ".venv,versions,.git" .
      - name: Tests and coverage (minimum 90 percent)
        run: python -m pytest
